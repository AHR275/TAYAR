<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #FFFFFF;">
    
<div class="container-fluid py-5" style="background-color: #88e0f4; color: #000000; min-height: 80vh;">
    
    <div class="row mb-4 px-3">
        <div class="col">
            <h2 class="fw-bold text-dark mb-1">Energy Analytics Dashboard</h2>
            <p class="text-muted">Track room consumption patterns and real-time energy usage statistics.</p>
        </div>
    </div>

    <div class="row g-4 px-3">
        <div class="col-12">
            
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm border-0 h-100" style="background-color: #F8F9FA; border-left: 5px solid #26B4F3;">
                        <span class="text-muted small fw-bold text-uppercase">Average Daily Consumption</span>
                        <h2 class="fw-bold my-2" style="color: #26B4F3;">22.1 kWh</h2>
                        <span class="text-success small fw-medium">↓ 12% less than last week</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm border-0 h-100" style="background-color: #F8F9FA; border-left: 5px solid #FFDE4D;">
                        <span class="text-muted small fw-bold text-uppercase">Peak Utilization Time</span>
                        <h2 class="fw-bold my-2" style="color: #000000;">02:00 PM - 04:00 PM</h2>
                        <span class="text-muted small">Matches heavy daytime appliance usage</span>
                    </div>
                </div>
            </div>

            <div class="card p-4 shadow-sm border-0" style="background-color: #F8F9FA; border-radius: 8px;">
                <h5 class="fw-bold text-dark mb-4">Weekly Consumption Overview</h5>
                <div style="position: relative; width: 100%; height: auto;">
                    <canvas id="weeklyUsageChart" width="400" height="150"></canvas>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<script src="{{ url_for('static', filename='js/chart-config.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const ctx = document.getElementById('weeklyUsageChart').getContext('2d');
    
    const weeklyUsageChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: DASHBOARD_SETTINGS.analytics.labels, 
            datasets: [{
                label: 'Electricity Consumed (kWh)',
                data: DASHBOARD_SETTINGS.analytics.dataPoints, 
                backgroundColor: DASHBOARD_SETTINGS.theme.barColor, 
                borderColor: DASHBOARD_SETTINGS.theme.borderColor, 
                borderWidth: 1, 
                borderRadius: DASHBOARD_SETTINGS.theme.borderRadius 
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Energy (kWh)',
                        font: { weight: 'bold' }
                    },
                    ticks: { color: DASHBOARD_SETTINGS.theme.textColor }
                },
                x: {
                    ticks: { color: DASHBOARD_SETTINGS.theme.textColor }
                }
            },
            plugins: {
                legend: {
                    display: true,
                    labels: {
                        color: DASHBOARD_SETTINGS.theme.textColor,
                        font: { weight: '600' }
                    }
                }
            }
        }
    });
});
</script>

</body>
</html>
