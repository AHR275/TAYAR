{% extends "index.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">

        <div class="mb-6">
            <h1 class="text-7xl font-bold text-red-500">403</h1>
            <h2 class="text-2xl font-semibold mt-4">
                Access Forbidden
            </h2>
        </div>

        <p class="text-gray-600 mb-8">
            You do not have permission to access this page or perform this action.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{{ url_for('home.home') }}"
               class="px-6 py-3 bg-sky-500 text-white rounded-lg hover:bg-sky-600 transition">
                Go Home
            </a>

            <button onclick="history.back()"
                    class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                Go Back
            </button>
        </div>

    </div>
</div>
{% endblock %}
